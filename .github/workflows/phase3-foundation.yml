name: Phase 3 foundation
on:
  push:
    branches: [redesign/phase-3]
  workflow_dispatch:
    inputs:
      harness_only:
        description: Prove embedded sandboxed child launch before foundation implementation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: phase3-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Prepare locked build runner and Ruby
        run: |
          bundle install --jobs 4 --retry 3
          sudo mkdir -p /Users/taha/Developer/attic-redesign-assets
          sudo cp Scripts/xcodebuild-locked.sh /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh
          sudo chmod +x /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh
          bundle exec ruby Scripts/verify_project_generation.rb
      - name: Run the signed sandboxed hosted unit suite
        env:
          HARNESS_ONLY: ${{ inputs.harness_only || false }}
          TEST_RUNNER_ATTIC_KEY_WINDOW_TESTS: "1"
        shell: /bin/zsh {0}
        run: |
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          T=(-only-testing:AtticTests)
          if [[ "$HARNESS_ONLY" == true ]]; then
            T=(-only-testing:AtticTests/OperationCrashHarnessTests)
          fi
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            "${F[@]}" build-for-testing
          Scripts/sign_crash_harness.zsh .build/dd/Build/Products/Local/AtticP3CrashHost.app
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/foundation.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO "${F[@]}" "${T[@]}" test-without-building
      - name: Inspect host and helper signature contracts
        if: always()
        run: |
          host=.build/dd/Build/Products/Local/AtticP3CrashHost.app
          python3 Scripts/verify_crash_harness_signature.py "$host"
      - name: Strict local-only build
        if: ${{ !inputs.harness_only }}
        shell: /bin/zsh {0}
        run: |
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            SWIFT_STRICT_CONCURRENCY=complete "${F[@]}" build
          bundle exec ruby Scripts/verify_project_generation.rb
          git diff --exit-code
      - name: Summarize tests
        if: always()
        run: |
          if [ -d .build/foundation.xcresult ]; then
            xcrun xcresulttool get test-results summary --path .build/foundation.xcresult --format json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-foundation-${{ github.sha }}
          path: .build/foundation.xcresult
          retention-days: 3
