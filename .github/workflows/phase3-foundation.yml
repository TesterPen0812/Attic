name: Phase 3 foundation
on:
  push:
    branches: [redesign/phase-3]
  workflow_dispatch:
    inputs:
      harness_only:
        description: Prove embedded sandboxed child launch before foundation implementation
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: phase3-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Prepare locked build runner and Ruby
        run: |
          bundle install --jobs 4 --retry 3
          sudo mkdir -p /Users/taha/Developer/attic-redesign-assets
          sudo cp Scripts/xcodebuild-locked.sh /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh
          sudo chmod +x /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh
          bundle exec ruby Scripts/verify_project_generation.rb
          mkdir -p .build
      - name: Measure fixed Phase 2 reference on this runner
        if: ${{ !inputs.harness_only }}
        shell: /bin/zsh {0}
        run: |
          base="$RUNNER_TEMP/AtticPFBase"
          mkdir -p "$base"
          git archive d77ec80ad91930d377bb3a5849c030c4d63c541e | tar -x -C "$base"
          cp AtticTests/TaskPerformanceGateTests.swift "$base/AtticTests/TaskPerformanceGateTests.swift"
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/AtticPFBaseBuild" \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
            "${F[@]}" -parallel-testing-enabled NO \
            -only-testing:AtticTests/TaskPerformanceGateTests/testPFFoundationSizeAndProductionPaths test \
            | tee .build/pf-base.log || true
          for test in testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase testPF5InterleavedSessionSoakAgainstPairedBase; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/AtticPFBaseBuild" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/TaskPerformanceGateTests/$test" test-without-building \
              | tee -a .build/pf-base.log || true
          done
          echo 'TEST_RUNNER_ATTIC_PF_REQUIRE_REFERENCE=1' >> "$GITHUB_ENV"
          for test in testMeasuredMainActorSaveOnFiveThousandLineNote testMeasuredMainActorSaveIsIndependentOfUnrelatedStoreContents; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/AtticPFBaseBuild" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/NotesPageControllerTests/$test" test-without-building \
              | tee -a .build/pf-base-phase2.log || true
          done
      - name: Build and sign the isolated hosted test products
        shell: /bin/zsh {0}
        run: |
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            "${F[@]}" build-for-testing
          Scripts/sign_crash_harness.zsh .build/dd/Build/Products/Local/AtticP3CrashHost.app
      # The paired probe needs a fresh process, just like the archived base;
      # earlier suites must not contaminate its absolute process footprint.
      - name: Run blocking paired PF1-PF3 and PF5 assertions
        if: ${{ !cancelled() && !inputs.harness_only }}
        shell: /bin/zsh {0}
        run: |
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          set -o pipefail
          paired_status=0
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/performance-gate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO "${F[@]}" \
            -only-testing:AtticTests/TaskPerformanceGateTests/testPFFoundationSizeAndProductionPaths test-without-building \
            | tee .build/pf-candidate.log || paired_status=$?
          for test in testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase testPF5InterleavedSessionSoakAgainstPairedBase; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project Attic.xcodeproj -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath .build/dd \
              -resultBundlePath ".build/$test.xcresult" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/TaskPerformanceGateTests/$test" test-without-building \
              | tee -a .build/pf-candidate.log || paired_status=$?
          done
          exit "$paired_status"
      - name: Measure fixed Phase 2 reference again
        if: ${{ !cancelled() && !inputs.harness_only }}
        shell: /bin/zsh {0}
        run: |
          base="$RUNNER_TEMP/AtticPFBase"
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          for test in testPFFoundationSizeAndProductionPaths testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase testPF5InterleavedSessionSoakAgainstPairedBase; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/AtticPFBaseBuild" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/TaskPerformanceGateTests/$test" test-without-building \
              | tee -a .build/pf-base-after.log || true
          done
          for test in testMeasuredMainActorSaveOnFiveThousandLineNote testMeasuredMainActorSaveIsIndependentOfUnrelatedStoreContents; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/AtticPFBaseBuild" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/NotesPageControllerTests/$test" test-without-building \
              | tee -a .build/pf-base-after-phase2.log || true
          done
      - name: Test paired PF gate plumbing
        if: ${{ !cancelled() && !inputs.harness_only }}
        run: python3 Scripts/test_pf_paired_gate.py
      - name: Evaluate paired PF gate
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ !cancelled() && !inputs.harness_only }}
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          # Only this exact candidate SHA can contribute carried row evidence.
          # Re-evaluate raw samples; never trust a saved PASS flag.
          mkdir -p .build/pf-history
          ids=($(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[] | select(.expired == false and (.name | startswith("phase3-pf-samples-" + env.GITHUB_SHA + "-")))] | sort_by(.id) | .[].id')) || exit $?
          if (( ${#ids[@]} > 2 )); then
            echo 'INPUT ERROR: more than two prior attempts for this candidate; three-run budget exhausted'
            exit 3
          fi
          history_args=()
          for id in "${ids[@]}"; do
            dir=".build/pf-history/$id"
            mkdir -p "$dir"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$dir/samples.zip" || exit $?
            unzip -q "$dir/samples.zip" -d "$dir" || exit $?
            history_args+=(--prior-run "$dir")
          done
          gate_status=0
          python3 Scripts/pf_paired_gate.py "${history_args[@]}" --base .build/pf-base.log --candidate .build/pf-candidate.log --base-after .build/pf-base-after.log | tee .build/pf-gate.txt || gate_status=$?
          if [[ "$gate_status" == 2 ]]; then
            echo 'UNMEASURABLE: carried rows require another valid run within the three-run budget'
          fi
          exit "$gate_status"
      - name: Measure OD-8 Done frame reference with identical fixtures
        if: ${{ !cancelled() && !inputs.harness_only }}
        shell: /bin/zsh {0}
        env:
          TEST_RUNNER_ATTIC_COST_REFERENCE_ONLY: "1"
        run: |
          set -o pipefail
          base="$RUNNER_TEMP/AtticP3DoneReference"
          mkdir -p "$base"
          git archive cb95a0e7ba164ca3c15927b9eb1e9ee7ea90f9b2 | tar -x -C "$base"
          cp AtticTests/DoneSearchCostTests.swift "$base/AtticTests/DoneSearchCostTests.swift"
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/AtticP3DoneReferenceBuild" \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3DoneReferenceHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3DoneReferenceHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.donereference \
            "${F[@]}" -parallel-testing-enabled NO \
            -only-testing:AtticTests/DoneSearchCostTests/testRenderedFindKeystrokeMediansFitTheInputBudget test \
            | tee .build/done-results-reference.log
      - name: Measure OD-8 Done candidate in the same fresh-process context
        if: ${{ !cancelled() && !inputs.harness_only }}
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/done-results-candidate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            "${F[@]}" -parallel-testing-enabled NO \
            -only-testing:AtticTests/DoneSearchCostTests/testRenderedFindKeystrokeMediansFitTheInputBudget test-without-building \
            | tee .build/done-results-candidate.log
      - name: Run C1-C5 and minimum taskNote format before the full suite
        if: ${{ !cancelled() }}
        env:
          TEST_RUNNER_ATTIC_KEY_WINDOW_TESTS: "1"
        shell: /bin/zsh {0}
        run: |
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/commit-gate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 360 \
            "${F[@]}" -only-testing:AtticTests/OperationCrashHarnessTests \
            -only-testing:AtticTests/WorkspaceCommitTests -only-testing:AtticTests/NoteFormatTests \
            -skip-testing:AtticTests/OperationCrashHarnessTests/testK8CoordinatedPurgeCrashesLeaveOnlyRecoverableExclusiveFileSurplus test-without-building
      - name: Run workspace history before purge
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/history-gate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 360 \
            "${F[@]}" -only-testing:AtticTests/WorkspaceHistoryTests -only-testing:AtticTests/WorkspaceTextReplayTests test-without-building
      - name: Run coordinated purge restore and K8
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/purge-gate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 360 \
            "${F[@]}" -only-testing:AtticTests/WorkspacePurgeTests -only-testing:AtticTests/OperationCrashHarnessTests/testK8CoordinatedPurgeCrashesLeaveOnlyRecoverableExclusiveFileSurplus test-without-building
      - name: Run the full hosted unit suite alone
        if: ${{ !cancelled() && !inputs.harness_only }}
        env:
          TEST_RUNNER_ATTIC_KEY_WINDOW_TESTS: "1"
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/foundation.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 360 \
            "${F[@]}" -only-testing:AtticTests \
            -skip-testing:AtticTests/TaskPerformanceGateTests/testPFFoundationSizeAndProductionPaths \
            -skip-testing:AtticTests/TaskPerformanceGateTests/testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase \
            -skip-testing:AtticTests/TaskPerformanceGateTests/testPF5InterleavedSessionSoakAgainstPairedBase test-without-building | tee .build/foundation.log
      - name: Evaluate OD-8 and OD-9 Done frame gate
        if: ${{ !cancelled() && !inputs.harness_only }}
        run: python3 Scripts/check_integration_costs.py --done-only .build
      - name: Inspect host and helper signature contracts
        if: always()
        run: |
          host=.build/dd/Build/Products/Local/AtticP3CrashHost.app
          python3 Scripts/verify_crash_harness_signature.py "$host"
      - name: Strict local-only build
        if: ${{ !cancelled() && !inputs.harness_only }}
        shell: /bin/zsh {0}
        run: |
          F=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            SWIFT_STRICT_CONCURRENCY=complete "${F[@]}" build
          bundle exec ruby Scripts/verify_project_generation.rb
          git diff --exit-code
      - name: Summarize tests
        if: always()
        run: |
          for result in .build/performance-gate.xcresult .build/commit-gate.xcresult .build/history-gate.xcresult .build/purge-gate.xcresult .build/foundation.xcresult .build/done-results-candidate.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool get test-results summary --path "$result" --format json
            fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !inputs.harness_only }}
        with:
          name: phase3-pf-samples-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/pf-base.log
            .build/pf-candidate.log
            .build/pf-base-after.log
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-foundation-${{ github.sha }}
          path: |
            .build/performance-gate.xcresult
            .build/testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase.xcresult
            .build/testPF5InterleavedSessionSoakAgainstPairedBase.xcresult
            .build/commit-gate.xcresult
            .build/history-gate.xcresult
            .build/purge-gate.xcresult
            .build/foundation.xcresult
            .build/pf-base.log
            .build/pf-base-phase2.log
            .build/pf-candidate.log
            .build/pf-base-after.log
            .build/pf-base-after-phase2.log
            .build/pf-gate.txt
            .build/done-results-reference.log
            .build/done-results-candidate.log
            .build/done-results-candidate.xcresult
            .build/foundation.log
            .build/done-results-comparison.json
          retention-days: 3
