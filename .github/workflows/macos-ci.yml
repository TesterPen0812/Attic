# Dispatch fka for the focused native keyboard gate; costs for optimized costs; fast for build/analyzer/unit; full for milestones.
name: Attic CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/canvas-ink
  workflow_dispatch:
    inputs:
      lane:
        description: Verification scope (full, fast, costs, or focused FKA)
        required: false
        default: full
        type: choice
        options: [full, fast, costs, fka]
      headless_costs:
        description: Run integration costs without key-window or UI fixtures (lane=costs)
        required: false
        default: false
        type: boolean
      run_iphone:
        description: Run the deferred iPhone build-for-testing lane
        required: false
        default: false
        type: boolean

      compare_note_save_gates:
        description: Record four interleaved d77ec80 and afebc3a save-gate runs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: attic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Script-driven builds use the same wrapper as explicit xcodebuild steps.
  XCODEBUILD: ${{ github.workspace }}/Scripts/xcodebuild_locked.sh
  ATTIC_XCODEBUILD_COMMAND: ${{ github.workspace }}/Scripts/xcodebuild_locked.sh
  LUNA_REPAIRED_COMMIT: 8063d92c995015b77a0493723270b6c183adb784
  BUNDLE_FROZEN: "true"
  PERF_REFERENCE_COMMIT: fb450820f5ccab289a050de3cf0695958786a465
  # The optimized cost gates compare against the last build whose costs
  # were accepted before Phase 1's D1 edge fade and Done search index
  # (redesign/p1-glass at 3eee023). Move it forward when a phase lands.
  COST_BASELINE_COMMIT: 3eee023e537717fbc42538a0a563643880f586eb
  # The Done search query samples compare against the last accepted build
  # with the Done search index (redesign/p1-glass at dab5d2f, CI run
  # 37121778773): query medians compare with its same-job samples, and
  # each query's median to the 16 ms budget (owner, 2026-10-03).
  # New relative gates use A10 before these test-only repairs, with identical fixtures.
  INTEGRATION_COST_REFERENCE_COMMIT: cb95a0e7ba164ca3c15927b9eb1e9ee7ea90f9b2
  DONE_SEARCH_BASELINE_COMMIT: dab5d2fb74b081529b0053797aca1af591b06e8b

jobs:
  fka:
    if: ${{ inputs.lane == 'fka' }}
    name: Focused Full Keyboard Access verification
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Build local-only test host
        run: |
          Scripts/xcodebuild_locked.sh build-for-testing -project Attic.xcodeproj -scheme Attic \
            -configuration Local -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticFKA" CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete
      - name: Run the native FKA test alone, then the H5-04 focus regressions
        env:
          TEST_RUNNER_ATTIC_KEY_WINDOW_TESTS: "1"
          TEST_RUNNER_ATTIC_FULL_KEYBOARD_ACCESS_TESTS: "1"
        run: |
          if old_keyboard_mode=$(defaults read -g AppleKeyboardUIMode 2>/dev/null); then
            trap 'defaults write -g AppleKeyboardUIMode -int "$old_keyboard_mode"' EXIT
          else
            trap 'defaults delete -g AppleKeyboardUIMode >/dev/null 2>&1 || true' EXIT
          fi
          defaults write -g AppleKeyboardUIMode -int 3
          run_tests() { # name, expected passes, tests...
            name=$1; expected=$2; shift 2
            only=(); for t in "$@"; do only+=(-only-testing:"AtticTests/AtticDropdownTests/$t"); done
            Scripts/xcodebuild_locked.sh test-without-building -project Attic.xcodeproj -scheme Attic \
              -configuration Local -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/AtticFKA" -resultBundlePath "$RUNNER_TEMP/AtticFKA-$name.xcresult" \
              CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO "${only[@]}" || true
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/AtticFKA-$name.xcresult" --format json > "$RUNNER_TEMP/fka-$name-summary.json" || echo '{}' > "$RUNNER_TEMP/fka-$name-summary.json"
            if python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["passedTests"]==int(sys.argv[2]) and s["skippedTests"]==0 and s["failedTests"]==0 and s["expectedFailures"]==0' "$RUNNER_TEMP/fka-$name-summary.json" "$expected"; then
              echo "FKA_RESULT $name: pass"; return 0
            fi
            echo "FKA_RESULT $name: FAIL"; cat "$RUNNER_TEMP/fka-$name-summary.json"; return 1
          }
          status=0
          # The native key-window interaction runs alone in its own process first.
          run_tests native 1 testTheTagPickerWorksFromTheKeyboardWithFullKeyboardAccess || status=1
          run_tests unit 3 \
            testH5_04OpeningGivesTheHostTheKeyboardAndOnlySwiftUIFocusesTheField \
            testH5_04AReusedPresenterOpensItsNextCardAsItOpenedTheFirst \
            testH5_04TabHandsTheKeyboardBetweenFieldAndRowsOnAReusedPresenter || status=1
          run_tests diagnosis 1 testZZDiagnoseFullKeyboardAccessListFocus || true
          exit $status
      - name: Upload focused keyboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-fka-${{ github.sha }}
          path: |
            ${{ runner.temp }}/AtticFKA-*.xcresult
            ${{ runner.temp }}/fka-*-summary.json

  macos:
    if: ${{ inputs.lane != 'costs' && inputs.lane != 'fka' }}
    name: Build, test, and analyze Attic for macOS
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify branch ancestry and initial cleanliness
        run: |
          git merge-base --is-ancestor "$LUNA_REPAIRED_COMMIT" HEAD
          test -z "$(git status --porcelain)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Luna base=$(git merge-base "$LUNA_REPAIRED_COMMIT" HEAD)"

      - name: Verify Xcode 26 toolchain
        run: |
          Scripts/xcodebuild_locked.sh -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          Scripts/xcodebuild_locked.sh -version | head -n 1 | grep -Eq '^Xcode 26\.'
          test "${sdk_version%%.*}" = 26

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies outside the checkout
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/AtticBundle" >> "$GITHUB_ENV"
          echo "BUNDLE_USER_CONFIG=$RUNNER_TEMP/AtticBundleConfig" >> "$GITHUB_ENV"
          export BUNDLE_PATH="$RUNNER_TEMP/AtticBundle"
          export BUNDLE_USER_CONFIG="$RUNNER_TEMP/AtticBundleConfig"
          bundle install --jobs 4 --retry 3

      - name: Regenerate checked-in Xcode project
        run: bundle exec ruby Scripts/generate_project.rb

      - name: Archive generated project evidence
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            Attic.xcodeproj \
            "$RUNNER_TEMP/Attic.xcodeproj.zip"

      - name: Upload generated project
        uses: actions/upload-artifact@v4
        with:
          name: generated-xcode-project-${{ github.sha }}
          path: ${{ runner.temp }}/Attic.xcodeproj.zip
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated Xcode project
        id: project_verify
        continue-on-error: true
        run: bundle exec ruby Scripts/verify_project_generation.rb

      - name: Build macOS target
        id: mac_build
        continue-on-error: true
        run: |
          Scripts/xcodebuild_locked.sh \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticBuild" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build with strict concurrency checking
        id: strict_build
        continue-on-error: true
        run: |
          Scripts/xcodebuild_locked.sh \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticStrictBuild" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            clean build

      - name: Run macOS unit tests
        id: unit_tests
        continue-on-error: true
        # Includes compiling the fresh host. The expanded Phase 2 suite
        # reached 2,382 passing cases before the old 20-minute watchdog.
        # Keep it bounded without changing test or performance assertions.
        timeout-minutes: 25
        env:
          # The runner has no person at it: unit tests may make a window key
          # and let AppKit resolve targetless menu actions for real.
          TEST_RUNNER_ATTIC_KEY_WINDOW_TESTS: "1"
        run: |
          # The bundle runs in the default keyboard mode, as most people use
          # it: Tab-order tests expect rows and fields, not every button.
          # Full Keyboard Access has its own step below.
          rm -rf "$RUNNER_TEMP/AtticUnitTests.xcresult"
          Scripts/xcodebuild_locked.sh \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticUnitTests" \
            -resultBundlePath "$RUNNER_TEMP/AtticUnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AtticTests \
            -skip-testing:AtticTests/DoneSearchCostTests \
            -skip-testing:AtticTests/TasksFrameCostTests \
            -skip-testing:AtticTests/TasksRowBuildCostTests \
            test

      - name: Run Full Keyboard Access unit tests
        id: fka_tests
        if: inputs.lane != 'fast'
        continue-on-error: true
        timeout-minutes: 10
        env:
          TEST_RUNNER_ATTIC_KEY_WINDOW_TESTS: "1"
          TEST_RUNNER_ATTIC_FULL_KEYBOARD_ACCESS_TESTS: "1"
        run: |
          # Enable AppKit Full Keyboard Access before the host starts, for
          # the tests written for it only. This changes only this disposable
          # CI runner and restores its setting.
          if old_keyboard_mode=$(defaults read -g AppleKeyboardUIMode 2>/dev/null); then
            trap 'defaults write -g AppleKeyboardUIMode -int "$old_keyboard_mode"' EXIT
          else
            trap 'defaults delete -g AppleKeyboardUIMode >/dev/null 2>&1 || true' EXIT
          fi
          defaults write -g AppleKeyboardUIMode -int 3
          rm -rf "$RUNNER_TEMP/AtticFullKeyboardAccessTests.xcresult"
          Scripts/xcodebuild_locked.sh \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticUnitTests" \
            -resultBundlePath "$RUNNER_TEMP/AtticFullKeyboardAccessTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AtticTests/AtticDropdownTests/testTheTagPickerWorksFromTheKeyboardWithFullKeyboardAccess \
            test-without-building
          # It must have run, not skipped.
          summary=$(xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/AtticFullKeyboardAccessTests.xcresult" --format json)
          echo "$summary"
          python3 -c 'import json, sys; s = json.load(sys.stdin); sys.exit(0 if s.get("passedTests") == 1 and s.get("skippedTests", 0) == 0 else 1)' <<<"$summary"

      - name: Print macOS unit-test summary
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/AtticUnitTests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/AtticUnitTests.xcresult" \
              --format json
          fi

      - name: Upload macOS unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unit-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/AtticUnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Full Keyboard Access test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-full-keyboard-access-results-${{ github.sha }}
          path: ${{ runner.temp }}/AtticFullKeyboardAccessTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Compare baseline and Fix 2 save gates on this runner
        if: inputs.compare_note_save_gates && inputs.lane != 'fast'
        timeout-minutes: 20
        run: |
          python3 Scripts/compare_note_save_gates.py "$RUNNER_TEMP/NoteSaveGateComparison" --unsigned

      - name: Upload baseline and Fix 2 save-gate evidence
        if: always() && inputs.compare_note_save_gates && inputs.lane != 'fast'
        uses: actions/upload-artifact@v4
        with:
          name: note-save-gate-comparison-${{ github.sha }}
          path: |
            ${{ runner.temp }}/NoteSaveGateComparison/results.json
            ${{ runner.temp }}/NoteSaveGateComparison/*.log
            ${{ runner.temp }}/NoteSaveGateComparison/*.xcresult
          if-no-files-found: error
          retention-days: 14

      - name: Run seeded macOS performance UI tests
        id: perf_ui_tests
        if: inputs.lane != 'fast'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          rm -rf "$RUNNER_TEMP/AtticPerformanceUITests.xcresult"
          Scripts/xcodebuild_locked.sh \
            -project Attic.xcodeproj \
            -scheme AtticUI \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticPerformanceUITests" \
            -resultBundlePath "$RUNNER_TEMP/AtticPerformanceUITests.xcresult" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ATTIC_MACOS_BUNDLE_IDENTIFIER=com.taha.Attic.perf.ui \
            -only-testing:AtticUITests/PerformanceUITests \
            test

      - name: Upload performance UI-test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-performance-ui-results-${{ github.sha }}
          path: ${{ runner.temp }}/AtticPerformanceUITests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Run macOS static analyzer
        id: analyzer
        continue-on-error: true
        run: |
          Scripts/xcodebuild_locked.sh \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticAnalyze" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Verify final project and worktree state
        id: final_state
        continue-on-error: true
        run: |
          bundle exec ruby Scripts/verify_project_generation.rb
          git diff --exit-code -- Attic.xcodeproj
          worktree_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$worktree_status" ]; then
            echo "Unexpected worktree changes after CI verification:"
            printf '%s\n' "$worktree_status"
            git diff --stat
            git diff
            git diff --cached --stat
            git diff --cached
            exit 1
          fi

      - name: Require established macOS verifications
        if: always()
        env:
          LANE: ${{ inputs.lane }}
          PROJECT_VERIFY: ${{ steps.project_verify.outcome }}
          MAC_BUILD: ${{ steps.mac_build.outcome }}
          STRICT_BUILD: ${{ steps.strict_build.outcome }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          FKA_TESTS: ${{ steps.fka_tests.outcome }}
          PERF_UI_TESTS: ${{ steps.perf_ui_tests.outcome }}
          ANALYZER: ${{ steps.analyzer.outcome }}
          FINAL_STATE: ${{ steps.final_state.outcome }}
        run: |
          printf '%-24s %s\n' \
            project-generation "$PROJECT_VERIFY" \
            mac-build "$MAC_BUILD" \
            strict-concurrency "$STRICT_BUILD" \
            unit-tests "$UNIT_TESTS" \
            full-keyboard-access "$FKA_TESTS" \
            performance-ui-tests "$PERF_UI_TESTS" \
            analyzer "$ANALYZER" \
            final-worktree "$FINAL_STATE"
          test "$PROJECT_VERIFY" = success
          test "$MAC_BUILD" = success
          test "$STRICT_BUILD" = success
          test "$UNIT_TESTS" = success
          if [ "$LANE" != fast ]; then test "$FKA_TESTS" = success; fi
          if [ "$LANE" != fast ]; then test "$PERF_UI_TESTS" = success; fi
          test "$ANALYZER" = success
          test "$FINAL_STATE" = success


  ui:
    if: ${{ inputs.lane != 'fast' && inputs.lane != 'costs' && inputs.lane != 'fka' }}
    name: macOS UI tests (${{ matrix.shard }} of 2)
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run macOS UI tests
        id: ui_tests
        # Run 37234266502: 2,295 s tests + bundle writing exceeded 40 min.
        # Classes below split the completed attempt's 2,132 s into 1,214/918 s.
        # 35 min allows ~1,307 s at the slower runtime + 180 s build + 600 s
        # bundle/runner headroom. Separate runners shorten the critical path.
        timeout-minutes: 35
        run: |
          rm -rf "$RUNNER_TEMP/AtticUITests.xcresult"
          rm -rf "$RUNNER_TEMP/attic-visual-uat"
          mkdir -p "$RUNNER_TEMP/attic-visual-uat"
          shard_flags=()
          for suite in AtticUITests CanvasUITests NotesFormatUITests; do
            if [ "${{ matrix.shard }}" = 1 ]; then
              shard_flags+=("-only-testing:AtticUITests/$suite")
            else
              shard_flags+=("-skip-testing:AtticUITests/$suite")
            fi
          done
          if [ "${{ matrix.shard }}" = 2 ]; then
            shard_flags+=(-only-testing:AtticUITests)
          fi
          ATTIC_VISUAL_UAT_DIRECTORY="$RUNNER_TEMP/attic-visual-uat" \
          Scripts/xcodebuild_locked.sh \
            -project Attic.xcodeproj \
            -scheme AtticUI \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticUITests" \
            -resultBundlePath "$RUNNER_TEMP/AtticUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            "${shard_flags[@]}" \
            -skip-testing:AtticUITests/PerformanceUITests \
            test

      - name: Print macOS UI-test summary
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/AtticUITests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/AtticUITests.xcresult" \
              --format json
          fi

      - name: Upload macOS UI-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-test-results-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/AtticUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual UAT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-visual-uat-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/attic-visual-uat
          if-no-files-found: ignore
          retention-days: 7


  costs:
    if: ${{ inputs.lane != 'fast' && inputs.lane != 'fka' }}
    name: Optimized frame, row and Done search cost gates
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Candidate commands inherit enforcement; only reference commands opt out.
      TEST_RUNNER_ATTIC_COST_REFERENCE_ONLY: "0"
      COST_FLAGS: >-
        CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule
        ENABLE_DEBUG_DYLIB=NO ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO

    # These fixtures time wall-clock work, so they run only here, on
    # optimized builds and one test at a time; the -Onone unit lane skips
    # them. OD-15 re-samples a failing comparison family once, AB/BA/AB;
    # first-attempt passing rows remain accepted.
    steps:
      - name: Check out candidate and baseline history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Xcode 26 toolchain and the cost baseline
        run: |
          Scripts/xcodebuild_locked.sh -version
          Scripts/xcodebuild_locked.sh -version | head -n 1 | grep -Eq '^Xcode 26\.'
          git merge-base --is-ancestor "$COST_BASELINE_COMMIT" HEAD
          git merge-base --is-ancestor "$DONE_SEARCH_BASELINE_COMMIT" HEAD
          git merge-base --is-ancestor "$INTEGRATION_COST_REFERENCE_COMMIT" HEAD
          mkdir -p "$RUNNER_TEMP/AtticCosts"

      - name: Verify cost gate plumbing
        run: python3 -m unittest discover -s Scripts -p 'test_*cost*.py' -v

      - name: Build optimized baseline and candidate test hosts
        id: cost_builds
        run: |
          git worktree add --detach "$RUNNER_TEMP/AtticCostBaseline" "$COST_BASELINE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/AtticDoneSearchBaseline" "$DONE_SEARCH_BASELINE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/AtticIntegrationCostReference" "$INTEGRATION_COST_REFERENCE_COMMIT"
          # Test-only overlay: identical measurement code, pinned reference app.
          for fixture in DoneSearchCostTests NotesPageControllerTests TaskPerformanceGateTests TasksKeystrokeCostTests NoteSlice3bTests; do
            cp "AtticTests/$fixture.swift" "$RUNNER_TEMP/AtticIntegrationCostReference/AtticTests/$fixture.swift"
          done
          git -C "$RUNNER_TEMP/AtticIntegrationCostReference" diff --exit-code -- Attic Attic.xcodeproj
          # Retain the historical fixtures and all measurements. Adapt only
          # their absolute timing assertions to the shared OD-6 policy.
          python3 Scripts/prepare_cost_reference.py "$RUNNER_TEMP/AtticCostBaseline" frame-row
          python3 Scripts/prepare_cost_reference.py "$RUNNER_TEMP/AtticDoneSearchBaseline" done
          builds=(baseline candidate donebase integrationbase)
          if [ "${{ inputs.headless_costs }}" = true ]; then builds=(candidate integrationbase); fi
          for name in "${builds[@]}"; do
            fixture_flags=()
            source="$GITHUB_WORKSPACE"
            if [ "$name" = baseline ]; then source="$RUNNER_TEMP/AtticCostBaseline"; fi
            if [ "$name" = donebase ]; then source="$RUNNER_TEMP/AtticDoneSearchBaseline"; fi
            if [ "$name" = integrationbase ]; then
              source="$RUNNER_TEMP/AtticIntegrationCostReference"
              # This pre-table app runs identical cost fixtures; the new
              # table-only functional test belongs to the candidate suite.
              fixture_flags=('OTHER_SWIFT_FLAGS=$(inherited) -DATTIC_COST_REFERENCE_HOST')
            fi
            # shellcheck disable=SC2086
            (cd "$source" && "$GITHUB_WORKSPACE/Scripts/xcodebuild_locked.sh" build-for-testing \
              -project Attic.xcodeproj -scheme Attic -configuration Local -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/AtticCost-$name" $COST_FLAGS "${fixture_flags[@]}") \
              > "$RUNNER_TEMP/AtticCosts/$name-build.log" 2>&1 \
              || { tail -n 80 "$RUNNER_TEMP/AtticCosts/$name-build.log"; exit 1; }
          done

      - name: Record three interleaved frame and row samples
        if: ${{ !inputs.headless_costs }}
        run: |
          for sample in 1 2 3; do
            for name in baseline candidate; do
              source="$GITHUB_WORKSPACE"
              reference_only=0
              if [ "$name" = baseline ]; then
                source="$RUNNER_TEMP/AtticCostBaseline"
                reference_only=1
              fi
              # shellcheck disable=SC2086
              (cd "$source" && TEST_RUNNER_ATTIC_COST_REFERENCE_ONLY="$reference_only" "$GITHUB_WORKSPACE/Scripts/xcodebuild_locked.sh" test-without-building \
                -project Attic.xcodeproj -scheme Attic -configuration Local -destination 'platform=macOS' \
                -derivedDataPath "$RUNNER_TEMP/AtticCost-$name" \
                -resultBundlePath "$RUNNER_TEMP/AtticCosts/$name-cost-$sample.xcresult" $COST_FLAGS \
                -parallel-testing-enabled NO \
                -only-testing:AtticTests/TasksFrameCostTests -only-testing:AtticTests/TasksRowBuildCostTests) \
                > "$RUNNER_TEMP/AtticCosts/$name-cost-$sample.log" 2>&1 \
                || { tail -n 80 "$RUNNER_TEMP/AtticCosts/$name-cost-$sample.log"; exit 1; }
              grep -E 'ATTIC_FRAME_COST|ATTIC_ROW_BUILD|ATTIC_COST_REFERENCE' "$RUNNER_TEMP/AtticCosts/$name-cost-$sample.log"
            done
          done

      - name: Record interleaved integration reference and candidate costs
        run: |
          for sample in 1 2 3; do
            # Balance order so runner drift does not always penalize candidate.
            sides=(baseline candidate)
            if [ "$sample" = 2 ]; then sides=(candidate baseline); fi
            for side in "${sides[@]}"; do
              source="$GITHUB_WORKSPACE"
              build=candidate
              rendered=()
              keystroke=()
              if [ "${{ inputs.headless_costs }}" != true ]; then
                keystroke=(-only-testing:AtticTests/TasksKeystrokeCostTests/testTheFirstKeystrokeCostsAboutWhatTheOthersDo)
              fi
              if [ "$side" = baseline ]; then
                source="$RUNNER_TEMP/AtticIntegrationCostReference"
                build=integrationbase
                if [ "$sample" = 1 ] && [ "${{ inputs.headless_costs }}" != true ]; then
                  rendered=(-only-testing:AtticTests/DoneSearchCostTests/testRenderedFindKeystrokeMediansFitTheInputBudget)
                fi
              fi
              # Reference collects timings only (OD-6); functional assertions remain.
              reference_only=0
              if [ "$side" = baseline ]; then reference_only=1; fi
              # shellcheck disable=SC2086
              (cd "$source" && TEST_RUNNER_ATTIC_COST_REFERENCE_ONLY="$reference_only" "$GITHUB_WORKSPACE/Scripts/xcodebuild_locked.sh" test-without-building \
                -project Attic.xcodeproj -scheme Attic -configuration Local -destination 'platform=macOS' \
                -derivedDataPath "$RUNNER_TEMP/AtticCost-$build" $COST_FLAGS \
                -resultBundlePath "$RUNNER_TEMP/AtticCosts/integration-$side-$sample.xcresult" \
                -parallel-testing-enabled NO \
                -only-testing:AtticTests/NotesPageControllerTests/testMeasuredMainActorSaveOnFiveThousandLineNote \
                -only-testing:AtticTests/NotesPageControllerTests/testMeasuredMainActorSaveIsIndependentOfUnrelatedStoreContents \
                -only-testing:AtticTests/NotesPageControllerTests/testCheckpointRetirementKeepsMainActorWithinSaveTolerance \
                -only-testing:AtticTests/NoteSlice3bTests/testR9AccessibilityValidationStaysResponsiveWithStoredPayloadsAndActiveImport \
                -only-testing:AtticTests/TaskPerformanceGateTests/testFamilySummaryPassAtSixThousandTasksIsMilliseconds \
                -only-testing:AtticTests/TaskPerformanceGateTests/testStatusToggleAtSixThousandTasksStaysBounded \
                "${keystroke[@]}" \
                "${rendered[@]}") \
                > "$RUNNER_TEMP/AtticCosts/integration-$side-$sample.log" 2>&1 \
                || { tail -n 100 "$RUNNER_TEMP/AtticCosts/integration-$side-$sample.log"; exit 1; }
              grep -E 'ATTIC_INTEGRATION_COST|ATTIC_DONE_RESULTS|ATTIC_DONE_KEY' "$RUNNER_TEMP/AtticCosts/integration-$side-$sample.log"
            done
          done

      - name: Done search query samples of the accepted baseline
        if: ${{ !inputs.headless_costs }}
        run: |
          # Three runs of the accepted build's query fixtures, for the
          # median comparison below. OD-6 disables only the
          # reference's absolute timing assertions; correctness still gates.
          for sample in 1 2 3; do
            # shellcheck disable=SC2086
            (cd "$RUNNER_TEMP/AtticDoneSearchBaseline" && TEST_RUNNER_ATTIC_COST_REFERENCE_ONLY=1 "$GITHUB_WORKSPACE/Scripts/xcodebuild_locked.sh" test-without-building \
              -project Attic.xcodeproj -scheme Attic -configuration Local -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/AtticCost-donebase" \
              -resultBundlePath "$RUNNER_TEMP/AtticCosts/done-search-baseline-$sample.xcresult" $COST_FLAGS \
              -parallel-testing-enabled NO \
              -only-testing:AtticTests/DoneSearchCostTests/testMeasuresDoneSearchOn5000Tasks \
              -only-testing:AtticTests/DoneSearchCostTests/testTheDiskBackedPhase5SeedAlsoFitsTheQueryBudget) \
              > "$RUNNER_TEMP/AtticCosts/done-search-baseline-$sample.log" 2>&1 \
              || { tail -n 120 "$RUNNER_TEMP/AtticCosts/done-search-baseline-$sample.log"; exit 1; }
            grep -q 'ATTIC_DONE_SEARCH session=2 ' "$RUNNER_TEMP/AtticCosts/done-search-baseline-$sample.log"
            grep -q 'ATTIC_PHASE5_DONE query=z ' "$RUNNER_TEMP/AtticCosts/done-search-baseline-$sample.log"
            grep -E 'ATTIC_DONE_SEARCH|ATTIC_PHASE5_DONE|ATTIC_COST_REFERENCE' "$RUNNER_TEMP/AtticCosts/done-search-baseline-$sample.log"
          done

      - name: Done search query, keystroke and results-frame budgets
        if: always() && steps.cost_builds.outcome == 'success' && !inputs.headless_costs
        run: |
          # shellcheck disable=SC2086
          "$GITHUB_WORKSPACE/Scripts/xcodebuild_locked.sh" test-without-building \
            -project Attic.xcodeproj -scheme Attic -configuration Local -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticCost-candidate" \
            -resultBundlePath "$RUNNER_TEMP/AtticCosts/done-search.xcresult" $COST_FLAGS \
            -parallel-testing-enabled NO -only-testing:AtticTests/DoneSearchCostTests \
            > "$RUNNER_TEMP/AtticCosts/done-search.log" 2>&1 \
            || { tail -n 120 "$RUNNER_TEMP/AtticCosts/done-search.log"; exit 1; }
          grep -E 'ATTIC_DONE_SEARCH|ATTIC_PHASE5_DONE|ATTIC_DONE_QUERY_MEDIAN|ATTIC_DONE_INPUT|ATTIC_DONE_RESULTS' "$RUNNER_TEMP/AtticCosts/done-search.log"

      - name: Compare cost rows and re-check failures once in this job
        if: always() && steps.cost_builds.outcome == 'success'
        run: |
          scope=()
          if [ "${{ inputs.headless_costs }}" = true ]; then scope=(--headless-only); fi
          python3 Scripts/recheck_cost_gates.py "${scope[@]}" "$RUNNER_TEMP/AtticCosts"

      - name: Print Done query and input evidence even on failure
        if: always() && !inputs.headless_costs
        run: |
          if [ -f "$RUNNER_TEMP/AtticCosts/done-search.log" ]; then
            grep -E 'ATTIC_DONE_SEARCH|ATTIC_PHASE5_DONE|ATTIC_DONE_INPUT|ATTIC_NATIVE_INPUT|ATTIC_DONE_RESULTS' \
              "$RUNNER_TEMP/AtticCosts/done-search.log" || true
          fi
          if [ -d "$RUNNER_TEMP/AtticCosts/done-search.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/AtticCosts/done-search.xcresult" --format json
          fi

      - name: Upload cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-cost-gates-${{ github.sha }}
          path: ${{ runner.temp }}/AtticCosts
          if-no-files-found: error
          retention-days: 14

  performance:
    if: ${{ inputs.lane != 'fast' && inputs.lane != 'costs' && inputs.lane != 'fka' }}
    name: Observe seeded performance on a fresh macOS runner
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out candidate and reference history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Xcode 26 toolchain
        id: perf_xcode
        continue-on-error: true
        run: |
          Scripts/xcodebuild_locked.sh -version
          Scripts/xcodebuild_locked.sh -version | head -n 1 | grep -Eq '^Xcode 26\.'

      - name: Record interleaved reference and candidate samples
        id: perf_probe
        if: steps.perf_xcode.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          started=$(date +%s)
          trap 'echo "first_samples_seconds=$(($(date +%s) - started))" >> "$RUNNER_TEMP/AtticPerfDurations.txt"' EXIT
          git merge-base --is-ancestor "$PERF_REFERENCE_COMMIT" HEAD
          git worktree add --detach "$RUNNER_TEMP/AtticPerfReference" "$PERF_REFERENCE_COMMIT"
          python3 Scripts/interleave_performance.py \
            "$RUNNER_TEMP/AtticPerfReference" . "$RUNNER_TEMP/AtticPerfFirst" --pairs 6

      # Confirmation must repeat the same primary measure before a
      # performance regression fails the required lane.
      - name: Report and confirm seeded preview comparison
        id: perf_compare
        if: steps.perf_probe.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          started=$(date +%s)
          trap 'echo "comparison_and_confirmation_seconds=$(($(date +%s) - started))" >> "$RUNNER_TEMP/AtticPerfDurations.txt"' EXIT
          if python3 Scripts/compare_performance.py \
              "$RUNNER_TEMP/AtticPerfFirst-reference.json" \
              "$RUNNER_TEMP/AtticPerfFirst-candidate.json" \
              --regressions-json "$RUNNER_TEMP/AtticPerfFirst-regressions.json"; then
            echo "No primary measure showed complete separation"
          else
            test -f "$RUNNER_TEMP/AtticPerfFirst-regressions.json"
            python3 Scripts/interleave_performance.py \
              "$RUNNER_TEMP/AtticPerfReference" . "$RUNNER_TEMP/AtticPerfConfirm" --pairs 6
            python3 Scripts/compare_performance.py \
              "$RUNNER_TEMP/AtticPerfConfirm-reference.json" \
              "$RUNNER_TEMP/AtticPerfConfirm-candidate.json" \
              --regressions-json "$RUNNER_TEMP/AtticPerfConfirm-regressions.json" \
              --require-common-with "$RUNNER_TEMP/AtticPerfFirst-regressions.json"
          fi

      - name: Upload same-run performance comparison and durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-performance-comparison-${{ github.sha }}
          path: |
            ${{ runner.temp }}/AtticPerfFirst-*.json
            ${{ runner.temp }}/AtticPerfConfirm-*.json
            ${{ runner.temp }}/AtticPerfDurations.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Require seeded performance lane success
        if: always()
        env:
          PERF_XCODE: ${{ steps.perf_xcode.outcome }}
          PERF_PROBE: ${{ steps.perf_probe.outcome }}
          PERF_COMPARE: ${{ steps.perf_compare.outcome }}
        run: |
          echo "Xcode 26 toolchain: $PERF_XCODE"
          echo "Seeded probe: $PERF_PROBE"
          echo "Comparison and confirmation: $PERF_COMPARE"
          test "$PERF_XCODE" = success
          test "$PERF_PROBE" = success
          test "$PERF_COMPARE" = success

  appearance:
    if: ${{ inputs.lane != 'fast' && inputs.lane != 'costs' && inputs.lane != 'fka' }}
    name: Design system appearance matrix (${{ matrix.shard }} of 4)
    runs-on: macos-26
    timeout-minutes: 45
    # Four shards in parallel, together every combination (round 4: the
    # whole matrix outgrew one 45-minute job; round 6 removed the review
    # switches, and the shards stay for headroom).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies outside the checkout
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/AtticBundle" >> "$GITHUB_ENV"
          echo "BUNDLE_USER_CONFIG=$RUNNER_TEMP/AtticBundleConfig" >> "$GITHUB_ENV"
          export BUNDLE_PATH="$RUNNER_TEMP/AtticBundle"
          export BUNDLE_USER_CONFIG="$RUNNER_TEMP/AtticBundleConfig"
          bundle install --jobs 4 --retry 3

      - name: Regenerate checked-in Xcode project
        run: bundle exec ruby Scripts/generate_project.rb

      # Every family in every combination, checked by code, plus the 15
      # contact sheets. The ordinary unit tests run only a representative
      # subset; this job is the full gate.
      - name: Run the full appearance matrix
        run: |
          Scripts/run_appearance_matrix.zsh \
            --output "$RUNNER_TEMP/AtticAppearance" \
            --derived-data "$RUNNER_TEMP/AtticAppearanceBuild" \
            --shard "$(( ${{ matrix.shard }} - 1 ))/4" \
            -- CODE_SIGNING_ALLOWED=NO

      - name: Upload contact sheets and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-matrix-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/AtticAppearance
          if-no-files-found: ignore
          retention-days: 14

  iphone:
    name: Build Attic for iPhone Simulator
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_iphone && inputs.lane != 'fast' && inputs.lane != 'costs' && inputs.lane != 'fka' }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify branch ancestry and initial cleanliness
        run: |
          git merge-base --is-ancestor "$LUNA_REPAIRED_COMMIT" HEAD
          test -z "$(git status --porcelain)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Luna base=$(git merge-base "$LUNA_REPAIRED_COMMIT" HEAD)"

      - name: Verify Xcode 26 toolchain
        run: |
          Scripts/xcodebuild_locked.sh -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          Scripts/xcodebuild_locked.sh -version | head -n 1 | grep -Eq '^Xcode 26\.'
          test "${sdk_version%%.*}" = 26

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies outside the checkout
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/AtticBundle" >> "$GITHUB_ENV"
          echo "BUNDLE_USER_CONFIG=$RUNNER_TEMP/AtticBundleConfig" >> "$GITHUB_ENV"
          export BUNDLE_PATH="$RUNNER_TEMP/AtticBundle"
          export BUNDLE_USER_CONFIG="$RUNNER_TEMP/AtticBundleConfig"
          bundle install --jobs 4 --retry 3

      - name: Regenerate checked-in Xcode project
        run: bundle exec ruby Scripts/generate_project.rb

      - name: Verify generated Xcode project
        id: project_verify
        continue-on-error: true
        run: bundle exec ruby Scripts/verify_project_generation.rb

      - name: Select an available iPhone simulator
        shell: python
        run: |
          import json
          import os
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          for runtime in sorted(payload["devices"], reverse=True):
              for device in payload["devices"][runtime]:
                  if device["name"].startswith("iPhone") and device.get("isAvailable", True):
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                          output.write(f"IOS_SIMULATOR_UDID={device['udid']}\n")
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")

      - name: Build iPhone app and tests
        id: iphone_build
        continue-on-error: true
        run: |
          Scripts/xcodebuild_locked.sh \
            -project Attic.xcodeproj \
            -scheme AtticMobile \
            -configuration Local \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/AtticMobileBuild" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            clean build-for-testing

      - name: Verify final project and worktree state
        id: final_state
        continue-on-error: true
        run: |
          bundle exec ruby Scripts/verify_project_generation.rb
          git diff --exit-code -- Attic.xcodeproj
          worktree_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$worktree_status" ]; then
            echo "Unexpected worktree changes after CI verification:"
            printf '%s\n' "$worktree_status"
            git diff --stat
            git diff
            git diff --cached --stat
            git diff --cached
            exit 1
          fi

      - name: Require every iPhone verification
        if: always()
        env:
          PROJECT_VERIFY: ${{ steps.project_verify.outcome }}
          IPHONE_BUILD: ${{ steps.iphone_build.outcome }}
          FINAL_STATE: ${{ steps.final_state.outcome }}
        run: |
          printf '%-24s %s\n' \
            project-generation "$PROJECT_VERIFY" \
            iphone-build-for-testing "$IPHONE_BUILD" \
            final-worktree "$FINAL_STATE"
          test "$PROJECT_VERIFY" = success
          test "$IPHONE_BUILD" = success
          test "$FINAL_STATE" = success
