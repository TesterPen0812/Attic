# Dispatch fka for the focused native keyboard gate; costs for optimized costs; fast for build/analyzer/unit; full for milestones.
name: Attic CI

on:
  # Pull requests do not start CI on every push (16 Nov 2026). A branch still
  # in a fix round pushed a full run each round, and those runs queued ahead of
  # a pull request that was ready to merge. The orchestrator starts the lane it
  # needs at gate time: gh workflow run "Attic CI" --ref <branch> -f lane=full.
  # Changes that touch only top-level Markdown, Docs/, Media/ or LICENSE don't
  # run CI: nothing they change is built or tested (owner, 2026-10-21). A file
  # a test reads, such as AtticTests/Fixtures/Compatibility/README.md, is not
  # covered by these patterns, so changing it still runs CI.
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Media/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      lane:
        description: Verification scope (full, fast, costs, or focused FKA)
        required: false
        default: full
        type: choice
        options: [full, fast, costs, fka]
      headless_costs:
        description: Run integration costs without key-window or UI fixtures (lane=costs)
        required: false
        default: false
        type: boolean
      run_iphone:
        description: Run the deferred iPhone build-for-testing lane
        required: false
        default: false
        type: boolean

      ui_tests:
        description: Space-separated -only-testing identifiers for a focused UI run (lane=full; skips every other job)
        required: false
        default: ''
        type: string

      inspect_dropdown_sampling:
        description: Record repeated old/paired priority estimates on the same runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: attic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every CI unit-test lane retains native presentation/key-window coverage,
  # including optimized cost hosts. Local hosts default to invisible.
  TEST_RUNNER_ATTIC_KEY_WINDOW_TESTS: "1"
  # Script-driven builds use the same wrapper as explicit xcodebuild steps.
  XCODEBUILD: ${{ github.workspace }}/Scripts/xcodebuild_locked.sh
  ATTIC_XCODEBUILD_COMMAND: ${{ github.workspace }}/Scripts/xcodebuild_locked.sh
  LUNA_REPAIRED_COMMIT: 8063d92c995015b77a0493723270b6c183adb784
  BUNDLE_FROZEN: "true"
  PERF_REFERENCE_COMMIT: fb450820f5ccab289a050de3cf0695958786a465
  # The optimized cost gates compare against the last build whose costs
  # were accepted before Phase 1's D1 edge fade and Done search index
  # (redesign/p1-glass at 3eee023). Move it forward when a phase lands.
  COST_BASELINE_COMMIT: 3eee023e537717fbc42538a0a563643880f586eb
  # The Done search query samples compare against the last accepted build
  # with the Done search index (redesign/p1-glass at dab5d2f, CI run
  # 37121778773): query medians compare with its same-job samples, and
  # each query's median to the 16 ms budget (owner, 2026-10-03).
  # New relative gates use A10 before these test-only repairs, with identical fixtures.
  INTEGRATION_COST_REFERENCE_COMMIT: cb95a0e7ba164ca3c15927b9eb1e9ee7ea90f9b2
  DONE_SEARCH_BASELINE_COMMIT: dab5d2fb74b081529b0053797aca1af591b06e8b

jobs:
  validate-inputs:
    name: Validate verification scope
    runs-on: ubuntu-latest
    steps:
      - name: Reject headless costs outside the costs lane
        env:
          LANE: ${{ inputs.lane }}
          HEADLESS_COSTS: ${{ inputs.headless_costs }}
        run: |
          if [ "$HEADLESS_COSTS" = true ] && [ "$LANE" != costs ]; then
            echo '::error::headless_costs=true requires lane=costs'
            exit 1
          fi

  round-trips:
    needs: validate-inputs
    if: ${{ inputs.lane != 'costs' && inputs.lane != 'fka' && !inputs.ui_tests }}
    name: Generated models, matrices, stress, and Notes round trips
    runs-on: macos-26
    # The complete successful generated suite plus compilation exceeded the
    # former 35-minute job watchdog; retain every seed and result assertion.
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install project generator dependencies
        run: |
          export BUNDLE_PATH="$RUNNER_TEMP/AtticRoundTripBundle"
          bundle install --jobs 4 --retry 3
          bundle exec ruby Scripts/generate_project.rb
          bundle exec ruby Scripts/verify_project_generation.rb
      - name: Resolve the committed parser versions
        run: |
          Scripts/xcodebuild_locked.sh -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile \
            -project Attic.xcodeproj -scheme AtticRoundTrips -configuration Local \
            -derivedDataPath "$RUNNER_TEMP/AtticRoundTrips"
      - name: Run every generated model, matrix, stress test, and FX3 property
        run: |
          Scripts/xcodebuild_locked.sh test -project Attic.xcodeproj -scheme AtticRoundTrips \
            -configuration Local -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticRoundTrips" \
            -resultBundlePath "$RUNNER_TEMP/AtticRoundTrips.xcresult" \
            CODE_SIGNING_ALLOWED=NO SWIFT_STRICT_CONCURRENCY=complete \
            -parallel-testing-enabled NO -only-testing:AtticRoundTripTests/AtticDesignSystemTests/testRepresentativeAppearanceSubset
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/AtticRoundTrips.xcresult" --format json > "$RUNNER_TEMP/round-trips-summary.json"
      - name: Upload round-trip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-round-trip-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/AtticRoundTrips.xcresult
            ${{ runner.temp }}/round-trips-summary.json
          if-no-files-found: error
          retention-days: 7

  appearance:
    needs: validate-inputs
    if: ${{ inputs.lane != 'fast' && inputs.lane != 'costs' && inputs.lane != 'fka' && !inputs.ui_tests }}
    name: Design system appearance matrix (${{ matrix.shard }} of 4)
    runs-on: macos-26
    timeout-minutes: 45
    # Four shards in parallel, together every combination (round 4: the
    # whole matrix outgrew one 45-minute job; round 6 removed the review
    # switches, and the shards stay for headroom).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies outside the checkout
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/AtticBundle" >> "$GITHUB_ENV"
          echo "BUNDLE_USER_CONFIG=$RUNNER_TEMP/AtticBundleConfig" >> "$GITHUB_ENV"
          export BUNDLE_PATH="$RUNNER_TEMP/AtticBundle"
          export BUNDLE_USER_CONFIG="$RUNNER_TEMP/AtticBundleConfig"
          bundle install --jobs 4 --retry 3

      - name: Regenerate checked-in Xcode project
        run: bundle exec ruby Scripts/generate_project.rb

      # Every family in every combination, checked by code, plus the 15
      # contact sheets. The ordinary unit tests run only a representative
      # subset; this job is the full gate.
      - name: Run the full appearance matrix
        run: |
          Scripts/run_appearance_matrix.zsh \
            --output "$RUNNER_TEMP/AtticAppearance" \
            --derived-data "$RUNNER_TEMP/AtticAppearanceBuild" \
            --shard "$(( ${{ matrix.shard }} - 1 ))/4" \
            -- CODE_SIGNING_ALLOWED=NO

      - name: Upload contact sheets and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-matrix-${{ github.sha }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/AtticAppearance
            ${{ runner.temp }}/attic-input-modes.log
          if-no-files-found: ignore
          retention-days: 14

