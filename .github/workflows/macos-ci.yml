name: Attic CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/canvas-ink
  workflow_dispatch:
    inputs:
      run_iphone:
        description: Run the deferred iPhone build-for-testing lane
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: attic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LUNA_REPAIRED_COMMIT: 8063d92c995015b77a0493723270b6c183adb784
  BUNDLE_FROZEN: "true"
  PERF_REFERENCE_COMMIT: 9af07560a4c7adf6d2d23df5b56d99da68373ba5

jobs:
  macos:
    name: Build, test, and analyze Attic for macOS
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify branch ancestry and initial cleanliness
        run: |
          git merge-base --is-ancestor "$LUNA_REPAIRED_COMMIT" HEAD
          test -z "$(git status --porcelain)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Luna base=$(git merge-base "$LUNA_REPAIRED_COMMIT" HEAD)"

      - name: Verify Xcode 26 toolchain
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 26\.'
          test "${sdk_version%%.*}" = 26

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies outside the checkout
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/AtticBundle" >> "$GITHUB_ENV"
          echo "BUNDLE_USER_CONFIG=$RUNNER_TEMP/AtticBundleConfig" >> "$GITHUB_ENV"
          export BUNDLE_PATH="$RUNNER_TEMP/AtticBundle"
          export BUNDLE_USER_CONFIG="$RUNNER_TEMP/AtticBundleConfig"
          bundle install --jobs 4 --retry 3

      - name: Regenerate checked-in Xcode project
        run: bundle exec ruby Scripts/generate_project.rb

      - name: Archive generated project evidence
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            Attic.xcodeproj \
            "$RUNNER_TEMP/Attic.xcodeproj.zip"

      - name: Upload generated project
        uses: actions/upload-artifact@v4
        with:
          name: generated-xcode-project-${{ github.sha }}
          path: ${{ runner.temp }}/Attic.xcodeproj.zip
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated Xcode project
        id: project_verify
        continue-on-error: true
        run: bundle exec ruby Scripts/verify_project_generation.rb

      - name: Build macOS target
        id: mac_build
        continue-on-error: true
        run: |
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticBuild" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build with strict concurrency checking
        id: strict_build
        continue-on-error: true
        run: |
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticStrictBuild" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            clean build

      - name: Run macOS unit tests
        id: unit_tests
        continue-on-error: true
        timeout-minutes: 20
        run: |
          rm -rf "$RUNNER_TEMP/AtticUnitTests.xcresult"
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticUnitTests" \
            -resultBundlePath "$RUNNER_TEMP/AtticUnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AtticTests \
            test

      - name: Print macOS unit-test summary
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/AtticUnitTests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/AtticUnitTests.xcresult" \
              --format json
          fi

      - name: Upload macOS unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unit-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/AtticUnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Run macOS UI tests
        id: ui_tests
        continue-on-error: true
        timeout-minutes: 30
        run: |
          rm -rf "$RUNNER_TEMP/AtticUITests.xcresult"
          rm -rf "$RUNNER_TEMP/attic-visual-uat"
          mkdir -p "$RUNNER_TEMP/attic-visual-uat"
          ATTIC_VISUAL_UAT_DIRECTORY="$RUNNER_TEMP/attic-visual-uat" \
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme AtticUI \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticUITests" \
            -resultBundlePath "$RUNNER_TEMP/AtticUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AtticUITests \
            -skip-testing:AtticUITests/PerformanceUITests \
            test

      - name: Print macOS UI-test summary
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/AtticUITests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/AtticUITests.xcresult" \
              --format json
          fi

      - name: Upload macOS UI-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/AtticUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual UAT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-visual-uat-${{ github.sha }}
          path: ${{ runner.temp }}/attic-visual-uat
          if-no-files-found: ignore
          retention-days: 7

      - name: Run seeded macOS performance UI tests
        id: perf_ui_tests
        continue-on-error: true
        timeout-minutes: 45
        run: |
          rm -rf "$RUNNER_TEMP/AtticPerformanceUITests.xcresult"
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme AtticUI \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticPerformanceUITests" \
            -resultBundlePath "$RUNNER_TEMP/AtticPerformanceUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            ATTIC_MACOS_BUNDLE_IDENTIFIER=com.taha.Attic.perf.ui \
            -only-testing:AtticUITests/PerformanceUITests \
            test

      - name: Upload performance UI-test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-performance-ui-results-${{ github.sha }}
          path: ${{ runner.temp }}/AtticPerformanceUITests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Compare seeded preview with Phase 0 reference on this runner
        id: perf_probe
        continue-on-error: true
        timeout-minutes: 90
        run: |
          git worktree add --detach "$RUNNER_TEMP/AtticPerfReference" "$PERF_REFERENCE_COMMIT"
          python3 Scripts/interleave_performance.py \
            "$RUNNER_TEMP/AtticPerfReference" . "$RUNNER_TEMP/AtticPerfFirst"

      # Runner variance needs several macos-26 jobs before this is a required
      # gate. Confirm a suspected regression with a fresh interleaved sample.
      - name: Report and confirm seeded preview comparison
        id: perf_compare
        if: steps.perf_probe.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          if ! python3 Scripts/compare_performance.py \
              "$RUNNER_TEMP/AtticPerfFirst-reference.json" \
              "$RUNNER_TEMP/AtticPerfFirst-candidate.json"; then
            python3 Scripts/interleave_performance.py \
              "$RUNNER_TEMP/AtticPerfReference" . "$RUNNER_TEMP/AtticPerfConfirm"
            python3 Scripts/compare_performance.py \
              "$RUNNER_TEMP/AtticPerfConfirm-reference.json" \
              "$RUNNER_TEMP/AtticPerfConfirm-candidate.json"
          fi

      - name: Upload same-run performance comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-performance-comparison-${{ github.sha }}
          path: |
            ${{ runner.temp }}/AtticPerfFirst-*.json
            ${{ runner.temp }}/AtticPerfConfirm-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run macOS static analyzer
        id: analyzer
        continue-on-error: true
        run: |
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AtticAnalyze" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Verify final project and worktree state
        id: final_state
        continue-on-error: true
        run: |
          bundle exec ruby Scripts/verify_project_generation.rb
          git diff --exit-code -- Attic.xcodeproj
          worktree_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$worktree_status" ]; then
            echo "Unexpected worktree changes after CI verification:"
            printf '%s\n' "$worktree_status"
            git diff --stat
            git diff
            git diff --cached --stat
            git diff --cached
            exit 1
          fi

      - name: Require every macOS verification
        if: always()
        env:
          PROJECT_VERIFY: ${{ steps.project_verify.outcome }}
          MAC_BUILD: ${{ steps.mac_build.outcome }}
          STRICT_BUILD: ${{ steps.strict_build.outcome }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          UI_TESTS: ${{ steps.ui_tests.outcome }}
          PERF_UI_TESTS: ${{ steps.perf_ui_tests.outcome }}
          PERF_PROBE: ${{ steps.perf_probe.outcome }}
          PERF_COMPARE: ${{ steps.perf_compare.outcome }}
          ANALYZER: ${{ steps.analyzer.outcome }}
          FINAL_STATE: ${{ steps.final_state.outcome }}
        run: |
          printf '%-24s %s\n' \
            project-generation "$PROJECT_VERIFY" \
            mac-build "$MAC_BUILD" \
            strict-concurrency "$STRICT_BUILD" \
            unit-tests "$UNIT_TESTS" \
            ui-tests "$UI_TESTS" \
            performance-ui-tests "$PERF_UI_TESTS" \
            performance-comparison "$PERF_PROBE" \
            performance-regression-observation "$PERF_COMPARE" \
            analyzer "$ANALYZER" \
            final-worktree "$FINAL_STATE"
          test "$PROJECT_VERIFY" = success
          test "$MAC_BUILD" = success
          test "$STRICT_BUILD" = success
          test "$UNIT_TESTS" = success
          test "$UI_TESTS" = success
          test "$PERF_UI_TESTS" = success
          test "$PERF_PROBE" = success
          test "$ANALYZER" = success
          test "$FINAL_STATE" = success

  iphone:
    name: Build Attic for iPhone Simulator
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_iphone }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify branch ancestry and initial cleanliness
        run: |
          git merge-base --is-ancestor "$LUNA_REPAIRED_COMMIT" HEAD
          test -z "$(git status --porcelain)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Luna base=$(git merge-base "$LUNA_REPAIRED_COMMIT" HEAD)"

      - name: Verify Xcode 26 toolchain
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 26\.'
          test "${sdk_version%%.*}" = 26

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies outside the checkout
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/AtticBundle" >> "$GITHUB_ENV"
          echo "BUNDLE_USER_CONFIG=$RUNNER_TEMP/AtticBundleConfig" >> "$GITHUB_ENV"
          export BUNDLE_PATH="$RUNNER_TEMP/AtticBundle"
          export BUNDLE_USER_CONFIG="$RUNNER_TEMP/AtticBundleConfig"
          bundle install --jobs 4 --retry 3

      - name: Regenerate checked-in Xcode project
        run: bundle exec ruby Scripts/generate_project.rb

      - name: Verify generated Xcode project
        id: project_verify
        continue-on-error: true
        run: bundle exec ruby Scripts/verify_project_generation.rb

      - name: Select an available iPhone simulator
        shell: python
        run: |
          import json
          import os
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          for runtime in sorted(payload["devices"], reverse=True):
              for device in payload["devices"][runtime]:
                  if device["name"].startswith("iPhone") and device.get("isAvailable", True):
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                          output.write(f"IOS_SIMULATOR_UDID={device['udid']}\n")
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")

      - name: Build iPhone app and tests
        id: iphone_build
        continue-on-error: true
        run: |
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme AtticMobile \
            -configuration Local \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/AtticMobileBuild" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            clean build-for-testing

      - name: Verify final project and worktree state
        id: final_state
        continue-on-error: true
        run: |
          bundle exec ruby Scripts/verify_project_generation.rb
          git diff --exit-code -- Attic.xcodeproj
          worktree_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$worktree_status" ]; then
            echo "Unexpected worktree changes after CI verification:"
            printf '%s\n' "$worktree_status"
            git diff --stat
            git diff
            git diff --cached --stat
            git diff --cached
            exit 1
          fi

      - name: Require every iPhone verification
        if: always()
        env:
          PROJECT_VERIFY: ${{ steps.project_verify.outcome }}
          IPHONE_BUILD: ${{ steps.iphone_build.outcome }}
          FINAL_STATE: ${{ steps.final_state.outcome }}
        run: |
          printf '%-24s %s\n' \
            project-generation "$PROJECT_VERIFY" \
            iphone-build-for-testing "$IPHONE_BUILD" \
            final-worktree "$FINAL_STATE"
          test "$PROJECT_VERIFY" = success
          test "$IPHONE_BUILD" = success
          test "$FINAL_STATE" = success
