name: Publish Verified Note Draft Repair

on:
  push:
    branches:
      - audit/macos-reliability-final-2026-08-25
    paths:
      - .github/workflows/publish-verified-note-draft.yml

permissions:
  contents: write

concurrency:
  group: publish-verified-note-draft
  cancel-in-progress: false

jobs:
  publish:
    name: Rebuild verified tree and publish clean commit
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Check out complete clean-branch history
        uses: actions/checkout@v4
        with:
          ref: audit/macos-reliability-final-2026-08-25
          fetch-depth: 0

      - name: Reconstruct reviewed macOS files from verified commit
        shell: bash
        run: |
          set -euo pipefail
          verified_commit=e9f98e9a731e0ec2bf8b853a9934de228ca590ae
          clean_parent=9af2b23ae123ea29de9db490b52fb3f3c86edd06
          git fetch origin "$verified_commit"
          git reset --hard "$clean_parent"
          git checkout "$verified_commit" -- \
            Attic.xcodeproj/project.pbxproj \
            Attic/App/AppCoordinator.swift \
            Attic/App/AppDelegate.swift \
            Attic/Services/CornerHoverMonitor.swift \
            Attic/Services/NoteDraftController.swift \
            Attic/Services/PanelGeometry.swift \
            Attic/Views/Panel/AtticPanelView.swift \
            Attic/Views/Panel/NotesPanelContent.swift \
            Attic/Views/Panel/TaskComposerView.swift \
            Attic/Window/AtticPanelController.swift \
            Attic/Window/PanelUIState.swift \
            AtticTests/CornerHoverStateMachineTests.swift \
            AtticTests/NoteDraftControllerTests.swift \
            AtticTests/TestSupport.swift \
            Scripts/verify_project_generation.rb
          git diff --cached --check

      - name: Enforce exact macOS-only file scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          Attic.xcodeproj/project.pbxproj
          Attic/App/AppCoordinator.swift
          Attic/App/AppDelegate.swift
          Attic/Services/CornerHoverMonitor.swift
          Attic/Services/NoteDraftController.swift
          Attic/Services/PanelGeometry.swift
          Attic/Views/Panel/AtticPanelView.swift
          Attic/Views/Panel/NotesPanelContent.swift
          Attic/Views/Panel/TaskComposerView.swift
          Attic/Window/AtticPanelController.swift
          Attic/Window/PanelUIState.swift
          AtticTests/CornerHoverStateMachineTests.swift
          AtticTests/NoteDraftControllerTests.swift
          AtticTests/TestSupport.swift
          Scripts/verify_project_generation.rb
          EOF
          git diff --cached --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          if git diff --cached --name-only | grep -E '^(AtticMobile|AtticMobileTests|AtticMobileUITests)/|^Attic\.xcodeproj/xcshareddata/xcschemes/AtticMobile\.xcscheme$'; then
            echo 'Unexpected iOS companion change detected.'
            exit 1
          fi

      - name: Verify project membership and generator repeatability
        shell: bash
        run: |
          set -euo pipefail
          ruby Scripts/verify_project_generation.rb
          grep -q 'NoteDraftController.swift' Attic.xcodeproj/project.pbxproj
          grep -q 'NoteDraftControllerTests.swift' Attic.xcodeproj/project.pbxproj

      - name: Clean Local macOS target build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p AuditArtifacts
          xcodebuild \
            -project Attic.xcodeproj \
            -target Attic \
            -configuration Local \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee AuditArtifacts/target-build.log

      - name: Clean Local macOS scheme build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee AuditArtifacts/scheme-build.log

      - name: Run all macOS unit and UI tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath AuditArtifacts/AtticTests.xcresult \
            test 2>&1 | tee AuditArtifacts/tests.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-note-draft-publish-${{ github.sha }}
          path: |
            AuditArtifacts/*.log
            AuditArtifacts/*.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and publish one clean logical change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Attic Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(macOS): preserve note drafts across lifecycle and sync'
          git fetch origin audit/macos-reliability-final-2026-08-25
          remote_head=$(git rev-parse origin/audit/macos-reliability-final-2026-08-25)
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch advanced from $GITHUB_SHA to $remote_head during verification."
            exit 1
          fi
          git push \
            --force-with-lease=refs/heads/audit/macos-reliability-final-2026-08-25:$GITHUB_SHA \
            origin \
            HEAD:refs/heads/audit/macos-reliability-final-2026-08-25
