name: Apply macOS Audit Patch

on:
  push:
    branches:
      - audit/macos-reliability-2026-08-25
    paths:
      - AuditPatches/current.patch

permissions:
  contents: write

concurrency:
  group: apply-macos-audit-patch
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and verify queued macOS repair
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate patch metadata and restore logical parent
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file=AuditPatches/current.patch
          [[ -f "$patch_file" ]]

          commit_message=$(sed -n 's/^# commit-message: //p' "$patch_file" | head -1)
          verification=$(sed -n 's/^# verification: //p' "$patch_file" | head -1)
          [[ -n "$commit_message" ]]
          [[ "$verification" == unit || "$verification" == full ]]

          first_queue_commit=$(git log --format=%H --reverse -- "$patch_file" | head -1)
          [[ -n "$first_queue_commit" ]]
          logical_parent=$(git rev-parse "${first_queue_commit}^")

          tail -n +4 "$patch_file" > /tmp/macos-audit.patch
          git apply --check /tmp/macos-audit.patch
          cp /tmp/macos-audit.patch "$RUNNER_TEMP/applied.patch"
          git reset --hard "$logical_parent"
          git apply --index /tmp/macos-audit.patch

          {
            echo "message=$commit_message"
            echo "verification=$verification"
            echo "logical_parent=$logical_parent"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate and verify the Xcode project
        shell: bash
        run: |
          set -o pipefail
          mkdir -p AuditArtifacts
          ruby Scripts/generate_project.rb 2>&1 | tee AuditArtifacts/project-generation.log
          ruby Scripts/verify_project_generation.rb 2>&1 | tee -a AuditArtifacts/project-generation.log
          git add Attic.xcodeproj/project.pbxproj

      - name: Clean Local macOS target build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Attic.xcodeproj \
            -target Attic \
            -configuration Local \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee AuditArtifacts/target-build.log

      - name: Clean Local macOS scheme build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee AuditArtifacts/scheme-build.log

      - name: Run macOS unit tests
        shell: bash
        run: |
          set -o pipefail
          rm -rf AuditArtifacts/AtticUnitTests.xcresult
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AtticTests \
            -resultBundlePath AuditArtifacts/AtticUnitTests.xcresult \
            test 2>&1 | tee AuditArtifacts/unit-tests.log

      - name: Run full macOS test suite when requested
        if: steps.patch.outputs.verification == 'full'
        shell: bash
        run: |
          set -o pipefail
          rm -rf AuditArtifacts/AtticFullTests.xcresult
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath AuditArtifacts/AtticFullTests.xcresult \
            test 2>&1 | tee AuditArtifacts/full-tests.log

      - name: Commit the verified repair and replace the queue commit
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ steps.patch.outputs.message }}
        run: |
          set -euo pipefail
          git config user.name TesterPen0812
          git config user.email tahamuhammad0812@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:refs/heads/audit/macos-reliability-2026-08-25 \
            --force-with-lease=refs/heads/audit/macos-reliability-2026-08-25:${GITHUB_SHA}

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applied-macos-audit-patch-${{ github.sha }}
          path: |
            AuditArtifacts
            ${{ runner.temp }}/applied.patch
          if-no-files-found: warn
          retention-days: 14
