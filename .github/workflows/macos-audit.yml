name: macOS Audit

on:
  push:
    branches:
      - audit/macos-reliability-2026-08-25
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Build, test, and capture macOS audit evidence
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record environment and repository state
        shell: bash
        run: |
          set -o pipefail
          mkdir -p AuditArtifacts
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=$(git branch --show-current)"
            echo "COMMIT_COUNT=$(git rev-list --count HEAD)"
            echo "SHALLOW=$(git rev-parse --is-shallow-repository)"
            echo "MACOS=$(sw_vers -productVersion)"
            xcodebuild -version
            swift --version
            git status --short
          } | tee AuditArtifacts/environment.txt
          git log --oneline --decorate -20 > AuditArtifacts/recent-commits.txt
          git ls-files > AuditArtifacts/tracked-files.txt

      - name: Archive complete-history checkout and macOS source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./AuditArtifacts' \
            --exclude='./build' \
            --exclude='./DerivedData' \
            -czf /tmp/attic-full-history.tar.gz .
          cp /tmp/attic-full-history.tar.gz AuditArtifacts/

          candidates=(
            Attic
            AtticTests
            AtticUITests
            Attic.xcodeproj
            Scripts
            Gemfile
            Gemfile.lock
            AGENTS.md
            claude.md
            .gitignore
            .codex
            .github/workflows/macos-audit.yml
          )
          existing=()
          for path in "${candidates[@]}"; do
            if [[ -e "$path" ]]; then
              existing+=("$path")
            fi
          done
          tar -czf AuditArtifacts/macos-source.tar.gz "${existing[@]}"

      - name: Upload source and history evidence
        uses: actions/upload-artifact@v4
        with:
          name: macos-audit-source-${{ github.sha }}
          path: |
            AuditArtifacts/attic-full-history.tar.gz
            AuditArtifacts/macos-source.tar.gz
            AuditArtifacts/environment.txt
            AuditArtifacts/recent-commits.txt
            AuditArtifacts/tracked-files.txt
          if-no-files-found: error
          retention-days: 14

      - name: Capture project and scheme discovery
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -list -project Attic.xcodeproj 2>&1 | tee AuditArtifacts/xcodebuild-list.log
          xcodebuild -showBuildSettings \
            -project Attic.xcodeproj \
            -target Attic \
            -configuration Local \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee AuditArtifacts/build-settings-local.log
          xcodebuild -showdestinations \
            -project Attic.xcodeproj \
            -scheme Attic 2>&1 | tee AuditArtifacts/destinations.log

      - name: Verify generated project is current
        id: project_generation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [[ -f Scripts/verify_project_generation.rb ]]; then
            ruby Scripts/verify_project_generation.rb 2>&1 | tee AuditArtifacts/project-generation.log
          else
            echo "Scripts/verify_project_generation.rb is absent" | tee AuditArtifacts/project-generation.log
            exit 2
          fi

      - name: Clean Local macOS target build
        id: target_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Attic.xcodeproj \
            -target Attic \
            -configuration Local \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee AuditArtifacts/target-build.log

      - name: Clean Local macOS scheme build
        id: scheme_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee AuditArtifacts/scheme-build.log

      - name: Run macOS unit and UI tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Attic.xcodeproj \
            -scheme Attic \
            -configuration Local \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath AuditArtifacts/AtticTests.xcresult \
            test 2>&1 | tee AuditArtifacts/tests.log

      - name: Capture scoped static audit evidence
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '=== Swift files in macOS scope ==='
            find Attic AtticTests AtticUITests -type f -name '*.swift' -print | sort
            echo
            echo '=== Unsafe constructs ==='
            grep -RInE --include='*.swift' 'fatalError|precondition\(|preconditionFailure|as!|try!|[[:alnum:]_\)\]]!([[:space:][:punct:]]|$)|\[[^]]+\]' Attic AtticTests AtticUITests
            echo
            echo '=== Error suppression and temporary markers ==='
            grep -RInE --include='*.swift' 'try\?|catch[[:space:]]*\{|TODO|FIXME|HACK|print\(' Attic AtticTests AtticUITests
            echo
            echo '=== Concurrency and lifecycle constructs ==='
            grep -RInE --include='*.swift' 'Task[[:space:]]*\{|Task\.detached|DispatchQueue|NotificationCenter|Timer|addGlobalMonitor|addLocalMonitor|unowned|ModelContext|ModelContainer' Attic AtticTests AtticUITests
            echo
            echo '=== Rename remnants in behavior-affecting scope ==='
            grep -RInE 'Peekaboo|PEEKABOO|peekaboo' Attic AtticTests AtticUITests Attic.xcodeproj Scripts 2>/dev/null
            echo
            echo '=== Sensitive logging candidates ==='
            grep -RInE --include='*.swift' 'print\(|debugPrint\(|NSLog\(|Logger\.|os_log' Attic AtticTests AtticUITests
          } > AuditArtifacts/static-audit.txt 2>&1
          exit 0

      - name: Record step outcomes
        if: always()
        shell: bash
        env:
          PROJECT_GENERATION: ${{ steps.project_generation.outcome }}
          TARGET_BUILD: ${{ steps.target_build.outcome }}
          SCHEME_BUILD: ${{ steps.scheme_build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          {
            echo "project_generation=$PROJECT_GENERATION"
            echo "target_build=$TARGET_BUILD"
            echo "scheme_build=$SCHEME_BUILD"
            echo "tests=$TESTS"
          } | tee AuditArtifacts/outcomes.txt

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-audit-evidence-${{ github.sha }}
          path: |
            AuditArtifacts/*.log
            AuditArtifacts/*.txt
            AuditArtifacts/*.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on baseline verification failures
        if: always()
        shell: bash
        env:
          PROJECT_GENERATION: ${{ steps.project_generation.outcome }}
          TARGET_BUILD: ${{ steps.target_build.outcome }}
          SCHEME_BUILD: ${{ steps.scheme_build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          if [[ "$PROJECT_GENERATION" != success || "$TARGET_BUILD" != success || "$SCHEME_BUILD" != success || "$TESTS" != success ]]; then
            echo "One or more baseline verification steps failed. See uploaded evidence."
            exit 1
          fi