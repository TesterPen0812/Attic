name: Phase 4 headless core
on:
  push:
    branches: [redesign/phase-4]
permissions:
  contents: read
  actions: read
concurrency:
  group: phase4-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference:
    if: contains(github.event.head_commit.message, '[p4-reference]')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Prepare locked runner
        run: |
          bundle install --jobs 4 --retry 3
          sudo mkdir -p /Users/taha/Developer/attic-redesign-assets
          sudo cp Scripts/xcodebuild-locked.sh /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh
          sudo chmod +x /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh
          mkdir -p .build
      - name: Pinned optimized empty reference
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          base="$PWD/.build/pinned"
          mkdir -p "$base"
          git archive f4453108301a0d902235b0f4f8985a43b8a8b3d9 | tar -x -C "$base"
          cp AtticTests/CanvasCoreReferenceTests.swift "$base/AtticTests/"
          cd "$base"
          bundle exec ruby Scripts/generate_project.rb
          bundle exec ruby Scripts/verify_project_generation.rb
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule \
            ENABLE_TESTABILITY=YES ENABLE_DEBUG_DYLIB=NO \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP4ReferenceHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP4ReferenceHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p4.reference \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -parallel-testing-enabled NO -only-testing:AtticTests/CanvasCoreReferenceTests test \
            > ../p4-reference.log 2>&1
          python3 - <<'PY'
          import json, pathlib
          line = next(x for x in pathlib.Path('../p4-reference.log').read_text().splitlines() if 'P4_REFERENCE_JSON ' in x)
          samples = json.loads(line.split('P4_REFERENCE_JSON ', 1)[1])
          pathlib.Path('../p4-reference.json').write_text(json.dumps(samples, indent=2))
          PY
          cd ../..
          rm -rf .build/pinned
          rm -f .build/p4-reference.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-pinned-reference
          path: .build/p4-reference.json
          retention-days: 3
  core:
    if: "!contains(github.event.head_commit.message, '[p4-reference]')"
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Prepare locked runner
        run: |
          bundle install --jobs 4 --retry 3
          sudo mkdir -p /Users/taha/Developer/attic-redesign-assets
          sudo cp Scripts/xcodebuild-locked.sh /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh
          sudo chmod +x /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh
          mkdir -p .build
      - name: Measure fixed Phase 2 reference on this runner
        shell: /bin/zsh {0}
        run: |
          base="$PWD/.build/pf-base"
          mkdir -p "$base"
          git archive d77ec80ad91930d377bb3a5849c030c4d63c541e | tar -x -C "$base"
          cp AtticTests/TaskPerformanceGateTests.swift "$base/AtticTests/TaskPerformanceGateTests.swift"
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath "$PWD/.build/pf-base-dd" \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
            "${F[@]}" -parallel-testing-enabled NO \
            -only-testing:AtticTests/TaskPerformanceGateTests/testPFFoundationSizeAndProductionPaths test \
            | tee .build/pf-base.log || true
          for test in testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase testPF5InterleavedSessionSoakAgainstPairedBase; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath "$PWD/.build/pf-base-dd" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/TaskPerformanceGateTests/$test" test-without-building \
              | tee -a .build/pf-base.log || true
          done
          echo 'TEST_RUNNER_ATTIC_PF_REQUIRE_REFERENCE=1' >> "$GITHUB_ENV"
          for test in testMeasuredMainActorSaveOnFiveThousandLineNote testMeasuredMainActorSaveIsIndependentOfUnrelatedStoreContents; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath "$PWD/.build/pf-base-dd" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/NotesPageControllerTests/$test" test-without-building \
              | tee -a .build/pf-base-phase2.log || true
          done
      - name: Build and sign the isolated hosted test products
        shell: /bin/zsh {0}
        run: |
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            "${F[@]}" build-for-testing
          Scripts/sign_crash_harness.zsh .build/dd/Build/Products/Local/AtticP3CrashHost.app
      - name: Run Canvas core contracts and compatibility (headless)
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/canvas-core.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO "${F[@]}" \
            -only-testing:AtticTests/CanvasCoreContractsTests \
            -only-testing:AtticTests/CanvasCoreWriterTests \
            -only-testing:AtticTests/CanvasCoreStorageTests \
            -only-testing:AtticTests/CanvasCoreBudgetTests test-without-building
      - name: Blocking restricted metadata SQL proof
        if: ${{ !cancelled() }}
        env:
          TEST_RUNNER_ATTIC_P4_METADATA_SQL_PROOF: "1"
        shell: /bin/zsh {0}
        run: |
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO "${F[@]}" \
            -only-testing:AtticTests/CanvasCoreStorageTests/testP4MetadataQueryBudgetRestrictedFetchOf20By2000LeavesBodiesUnrequested \
            test-without-building > .build/p4-metadata-sql.log 2>&1
          python3 Scripts/p4_metadata_projection_gate.py .build/p4-metadata-sql.log
          rm -f .build/p4-metadata-sql.log
      # The paired probe needs a fresh process, just like the archived base;
      # earlier suites must not contaminate its absolute process footprint.
      - name: Run blocking paired PF1-PF3 and PF5 assertions
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          set -o pipefail
          paired_status=0
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/performance-gate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO "${F[@]}" \
            -only-testing:AtticTests/TaskPerformanceGateTests/testPFFoundationSizeAndProductionPaths test-without-building \
            | tee .build/pf-candidate.log || paired_status=$?
          for test in testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase testPF5InterleavedSessionSoakAgainstPairedBase; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project Attic.xcodeproj -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath .build/dd \
              -resultBundlePath ".build/$test.xcresult" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/TaskPerformanceGateTests/$test" test-without-building \
              | tee -a .build/pf-candidate.log || paired_status=$?
          done
          exit "$paired_status"
      - name: Measure fixed Phase 2 reference again
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          base="$PWD/.build/pf-base"
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          for test in testPFFoundationSizeAndProductionPaths testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase testPF5InterleavedSessionSoakAgainstPairedBase; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath "$PWD/.build/pf-base-dd" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/TaskPerformanceGateTests/$test" test-without-building \
              | tee -a .build/pf-base-after.log || true
          done
          for test in testMeasuredMainActorSaveOnFiveThousandLineNote testMeasuredMainActorSaveIsIndependentOfUnrelatedStoreContents; do
            /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
              -project "$base/Attic.xcodeproj" -scheme Attic -configuration Local \
              -destination 'platform=macOS' -derivedDataPath "$PWD/.build/pf-base-dd" \
              ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3PFBaseHost \
              ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.pfbase \
              "${F[@]}" -parallel-testing-enabled NO \
              -only-testing:"AtticTests/NotesPageControllerTests/$test" test-without-building \
              | tee -a .build/pf-base-after-phase2.log || true
          done
      - name: Test paired PF gate plumbing
        if: ${{ !cancelled() }}
        run: python3 Scripts/test_pf_paired_gate.py
      - name: Evaluate paired PF gate
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          set -o pipefail
          gate_status=0
          python3 Scripts/pf_paired_gate.py --base .build/pf-base.log --candidate .build/pf-candidate.log --base-after .build/pf-base-after.log | tee .build/pf-gate.txt || gate_status=$?
          if [[ "$gate_status" == 2 ]]; then
            echo 'UNMEASURABLE: base failed against itself; rerun the failed job once'
          fi
          exit "$gate_status"
      - name: Run C1-C5 and minimum taskNote format before the full suite
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/commit-gate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 360 \
            "${F[@]}" -only-testing:AtticTests/OperationCrashHarnessTests \
            -only-testing:AtticTests/WorkspaceCommitTests -only-testing:AtticTests/NoteFormatTests \
            -skip-testing:AtticTests/OperationCrashHarnessTests/testK8CoordinatedPurgeCrashesLeaveOnlyRecoverableExclusiveFileSurplus test-without-building
      - name: Run workspace history before purge
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/history-gate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 360 \
            "${F[@]}" -only-testing:AtticTests/WorkspaceHistoryTests -only-testing:AtticTests/WorkspaceTextReplayTests test-without-building
      - name: Run coordinated purge restore and K8
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/purge-gate.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 360 \
            "${F[@]}" -only-testing:AtticTests/WorkspacePurgeTests -only-testing:AtticTests/OperationCrashHarnessTests/testK8CoordinatedPurgeCrashesLeaveOnlyRecoverableExclusiveFileSurplus test-without-building
      - name: Run the full hosted unit suite alone
        if: ${{ !cancelled() }}
        shell: /bin/zsh {0}
        run: |
          F=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO)
          /Users/taha/Developer/attic-redesign-assets/xcodebuild-locked.sh \
            -project Attic.xcodeproj -scheme Attic -configuration Local \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -resultBundlePath .build/foundation.xcresult \
            ATTIC_MACOS_UNIT_HOST_PRODUCT_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_EXECUTABLE_NAME=AtticP3CrashHost \
            ATTIC_MACOS_UNIT_HOST_BUNDLE_IDENTIFIER=com.taha.Attic.p3.crashhost \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 360 \
            "${F[@]}" -only-testing:AtticTests -skip-testing:AtticTests/CanvasCoreBudgetTests \
            -skip-testing:AtticTests/TaskPerformanceGateTests/testPFFoundationSizeAndProductionPaths \
            -skip-testing:AtticTests/TaskPerformanceGateTests/testPF1LargeAutosaveAndPreparedCommitAgainstPairedBase \
            -skip-testing:AtticTests/TaskPerformanceGateTests/testPF5InterleavedSessionSoakAgainstPairedBase \
